name: Issue triage

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply title-based labels
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const rules = [
              { label: 'bug', pattern: /\b(bug|crash|error|failure|regression)\b/ },
              { label: 'documentation', pattern: /\b(docs?|documentation)\b/ },
              { label: 'security', pattern: /\b(security|credential|secret|luks|tpm2)\b/ },
              { label: 'ci', pattern: /\b(ci|workflow|action|build|test)\b/ },
            ];
            const labels = rules
              .filter(({ pattern }) => pattern.test(title))
              .map(({ label }) => label);
            if (labels.length === 0) return;

            const available = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            );
            const known = new Set(available.map(({ name }) => name));
            const applicable = labels.filter((label) => known.has(label));
            if (applicable.length === 0) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: applicable,
            });
