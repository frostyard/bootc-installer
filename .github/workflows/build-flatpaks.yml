name: Build Multi-Variant Flatpaks

# frostyard fork notes (deviations from projectbluefin/bootc-installer):
#
# This workflow is build-validation only. Upstream also published the
# stable-app-id bundle to the rolling `latest-dev` release from here,
# racing with flatpak.yml (which owns `latest-dev` and publishes the
# .Devel bundle that dakota-iso's dev channel downloads). Whichever
# workflow finished last won, and upstream's delete-and-recreate could
# leave the release missing or holding the wrong asset. All release
# publishing now lives in flatpak.yml; this workflow only proves the
# stable manifest builds with a plain apt flatpak-builder on every
# dev/prod push. Actions are pinned to commit SHAs.

on:
  push:
    branches:
      - dev
      - prod
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-variants:
    strategy:
      matrix:
        variant:
          - name: gnome
            app_id: org.bootcinstaller.Installer
            manifest: flatpak/org.bootcinstaller.Installer.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            git \
            appstream \
            appstream-util \
            dbus

      - name: Initialize dbus
        run: |
          sudo mkdir -p /run/dbus
          sudo dbus-daemon --system --fork --nopidfile || true
          sleep 1

      - name: Add Flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build ${{ matrix.variant.name }} variant
        run: |
          flatpak-builder --force-clean --user --repo=flatpak-repo \
            --install-deps-from=flathub \
            --disable-rofiles-fuse \
            build-dir \
            ${{ matrix.variant.manifest }}

      - name: Export ${{ matrix.variant.name }} bundle
        run: |
          flatpak build-bundle flatpak-repo \
            ${{ matrix.variant.app_id }}.flatpak \
            ${{ matrix.variant.app_id }}

      - name: Upload Flatpak to artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.variant.app_id }}.flatpak
          path: ${{ matrix.variant.app_id }}.flatpak
          retention-days: 30

  release-summary:
    needs: build-variants
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0

      - name: Create release summary
        run: |
          {
            echo "## Flatpak Build Summary"
            echo ""
            echo "### Built Variants:"
            echo "- GNOME: org.bootcinstaller.Installer"
            echo ""
            echo "Bundles are uploaded as workflow artifacts; releases are published by flatpak.yml"
          } >> "$GITHUB_STEP_SUMMARY"
