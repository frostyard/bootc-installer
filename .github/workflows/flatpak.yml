name: Flatpak

# frostyard fork notes (deviations from projectbluefin/bootc-installer):
#
# 1. Actions are pinned to commit SHAs (upstream pins to floating tags).
# 2. The dev-channel publish updates the existing `latest-dev` release
#    in place instead of upstream's delete-and-recreate pattern.
#    Upstream's pattern permanently broke their dev channel: once GitHub
#    immutable releases banned reuse of the deleted tag name,
#    `gh release create latest-dev` fails forever (see projectbluefin
#    run 28007593013). Update-in-place never deletes the release or tag.
#    Do NOT enable immutable releases on this repository — the rolling
#    `latest-dev` release requires mutable assets.
# 3. workflow_dispatch added for manual runs (dispatching on `dev`
#    publishes latest-dev; on any other ref it is build-only).
#
# Publishing contract (consumed by frostyard/dakota-iso
# live/src/install-flatpaks.sh via INSTALLER_REPO):
#   dev channel:    releases/download/latest-dev/org.bootcinstaller.Installer.Devel.flatpak
#   stable channel: releases/latest/download/org.bootcinstaller.Installer.flatpak
#     (created by pushing a v* tag; /releases/latest resolves to the
#      newest non-prerelease release)

on:
  push:
    branches: [prod, dev]
    tags: ["v*"]
  pull_request:
    branches: [prod, dev]
  merge_group:
  workflow_dispatch:

jobs:
  production:
    name: Build (production)
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          bundle: org.bootcinstaller.Installer.flatpak
          manifest-path: flatpak/org.bootcinstaller.Installer.json
          cache-key: flatpak-builder-production-${{ github.sha }}

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: org.bootcinstaller.Installer.flatpak
          path: org.bootcinstaller.Installer.flatpak
          retention-days: 30

      - name: Attach bundle to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tagged-org.bootcinstaller.Installer.flatpak
          path: org.bootcinstaller.Installer.flatpak
          retention-days: 1

  devel:
    name: Build (devel)
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          bundle: org.bootcinstaller.Installer.Devel.flatpak
          manifest-path: flatpak/org.bootcinstaller.Installer.Devel.json
          cache-key: flatpak-builder-devel-${{ github.sha }}

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: org.bootcinstaller.Installer.Devel.flatpak
          path: org.bootcinstaller.Installer.Devel.flatpak
          retention-days: 30

      - name: Publish dev pre-release (dev branch)
        if: github.ref == 'refs/heads/dev'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          NOTES="Latest build from the \`dev\` branch (commit ${GITHUB_SHA}). May be unstable."
          # Update-in-place: never delete the release or its tag (see the
          # frostyard fork notes at the top of this file). --clobber
          # replaces the constant-name asset atomically.
          if gh release view latest-dev >/dev/null 2>&1; then
            gh release upload latest-dev org.bootcinstaller.Installer.Devel.flatpak --clobber
            gh release edit latest-dev \
              --prerelease \
              --title "Dev Build" \
              --notes "$NOTES"
            echo "Release assets updated"
          else
            gh release create latest-dev \
              --title "Dev Build" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --notes "$NOTES" \
              org.bootcinstaller.Installer.Devel.flatpak
            echo "Release created"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload devel bundle for tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tagged-org.bootcinstaller.Installer.Devel.flatpak
          path: org.bootcinstaller.Installer.Devel.flatpak
          retention-days: 1

  publish-tagged-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [production, devel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download production bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tagged-org.bootcinstaller.Installer.flatpak

      - name: Download devel bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tagged-org.bootcinstaller.Installer.Devel.flatpak

      - name: Create and publish release
        run: |
          # Upload assets to the release, creating it if needed.
          # The release may already exist if the tag was pushed manually
          # before CI ran (common during hotfix cycles).
          if ! gh release create ${{ github.ref_name }} \
              --repo ${{ github.repository }} \
              --title "bootc-installer ${{ github.ref_name }}" \
              --notes "Release ${{ github.ref_name }}" \
              org.bootcinstaller.Installer.flatpak \
              org.bootcinstaller.Installer.Devel.flatpak; then
            echo "Release already exists — uploading assets to existing release"
            gh release upload ${{ github.ref_name }} \
              --repo ${{ github.repository }} \
              --clobber \
              org.bootcinstaller.Installer.flatpak \
              org.bootcinstaller.Installer.Devel.flatpak
          fi
        env:
          GH_TOKEN: ${{ github.token }}
