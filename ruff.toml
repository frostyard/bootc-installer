# Keep local linting consistent with the Python version used by CI.
target-version = "py312"
line-length = 88

extend-exclude = [
    ".flatpak-builder",
    "_build",
    "build",
    "repo",
]

[lint]
# Ruff's stable default rules: pycodestyle errors and Pyflakes.
select = ["E4", "E7", "E9", "F"]
